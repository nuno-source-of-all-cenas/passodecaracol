<title>Passo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: top bar + three-column feed on desktop; one column and a bottom tab bar on phones. */
:root {
  --bg: #f4f6f3; --surface: #ffffff; --surface-2: #eef1ed; --border: #dde3dc; --border-input: #7c8a80;
  --text: #121a15; --muted: #59645d; --accent: #0b7a57; --accent-strong: #075e43; --on-accent: #ffffff; --accent-soft: #dff1e8;
  --danger: #b8382a; --warn: #a35f00; --gold: #b07c00; --gold-soft: #fbefcc; --pr: #6a3fb5; --pr-soft: #ece4fa;
  --sport-run: #0b7a57; --sport-ride: #3461c9; --sport-walk: #7b5cc4; --sport-hike: #9a6a22; --sport-swim: #1691b3; --sport-workout: #b5466b;
  --m-land: #eef0e8; --m-street: #ffffff; --m-avenue: #ffffff; --m-park: #d3e6c8; --m-water: #bcd6e8; --m-route: #d6336c; --m-halo: #ffffff; --m-seg: #f2a500;
  --z1: #9fb3c8; --z2: #4f9bd9; --z3: #3aa36b; --z4: #e8a33a; --z5: #d6453a;
  --shadow: 0 1px 2px rgba(18, 26, 21, .05), 0 2px 8px rgba(18, 26, 21, .05);
  --pop: 0 12px 32px rgba(18, 26, 21, .18);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1310; --surface: #161c18; --surface-2: #1d2420; --border: #2b342f; --border-input: #7d8b83;
    --text: #e7ece9; --muted: #9ba7a0; --accent: #3cc58f; --accent-strong: #5fd6a5; --on-accent: #04140d; --accent-soft: #163428;
    --danger: #ff7a6b; --warn: #f0a63a; --gold: #e9b93a; --gold-soft: #3a3014; --pr: #b896f2; --pr-soft: #2c2340;
    --sport-run: #3cc58f; --sport-ride: #7aa0ff; --sport-walk: #b39cf0; --sport-hike: #d9a35a; --sport-swim: #4fc3e3; --sport-workout: #f07fa3;
    --m-land: #18201b; --m-street: #262f2a; --m-avenue: #303a34; --m-park: #1d3324; --m-water: #142a3b; --m-route: #ff5c93; --m-halo: #0e1310; --m-seg: #ffc233;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --pop: 0 12px 32px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1310; --surface: #161c18; --surface-2: #1d2420; --border: #2b342f; --border-input: #7d8b83;
  --text: #e7ece9; --muted: #9ba7a0; --accent: #3cc58f; --accent-strong: #5fd6a5; --on-accent: #04140d; --accent-soft: #163428;
  --danger: #ff7a6b; --warn: #f0a63a; --gold: #e9b93a; --gold-soft: #3a3014; --pr: #b896f2; --pr-soft: #2c2340;
  --sport-run: #3cc58f; --sport-ride: #7aa0ff; --sport-walk: #b39cf0; --sport-hike: #d9a35a; --sport-swim: #4fc3e3; --sport-workout: #f07fa3;
  --m-land: #18201b; --m-street: #262f2a; --m-avenue: #303a34; --m-park: #1d3324; --m-water: #142a3b; --m-route: #ff5c93; --m-halo: #0e1310; --m-seg: #ffc233;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --pop: 0 12px 32px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: var(--text); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: .2px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); } .sm { font-size: 13px; } .xs { font-size: 12px; } .up { text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
.strong { font-weight: 700; } .center { text-align: center; display: block; margin-inline: auto; } .left { text-align: left; } .right { text-align: right; margin-left: auto; }
.block { display: block; } .grow { flex: 1; min-width: 0; } .num { font-variant-numeric: tabular-nums; } .big { font-size: 22px; font-family: var(--font-display); }
.ok { color: var(--accent); } .err { color: var(--danger); margin-top: 10px; } .acc { color: var(--accent); }
.ic { flex: none; vertical-align: middle; }

/* ---------- chrome ---------- */
#app { min-height: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1180px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 25px; letter-spacing: -.2px; color: var(--text); text-decoration: none; }
.logo-bg { fill: var(--accent); } .logo-fg { stroke: var(--on-accent); }
.top-nav { display: flex; gap: 2px; }
.tn { padding: 8px 12px; border-radius: var(--r-sm); font-weight: 600; color: var(--muted); }
.tn:hover { color: var(--text); background: var(--surface-2); } .tn.on { color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); border-radius: 0; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 50%; color: var(--text); position: relative; flex: none; }
.icon-btn:hover { background: var(--surface-2); } .icon-btn.sm { width: 30px; height: 30px; }
.icon-btn:disabled { opacity: .4; cursor: default; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.av-btn { border-radius: 50%; display: inline-flex; }
.tabbar { display: none; }
.view { max-width: 1180px; margin: 0 auto; padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.v-activity, .v-edit, .v-save, .v-segment, .v-record, .v-upload, .v-notifications, .v-search, .v-settings, .v-gear, .v-follows, .v-challenge, .v-club, .v-profile { max-width: 920px; }

@media (max-width: 760px) {
  .top-nav, .hide-sm { display: none !important; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tb { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .tb.on { color: var(--accent); }
  .tb-rec .rec-dot { width: 40px; height: 40px; margin-top: -14px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: var(--pop); }
  .view { padding-top: 14px; }
  h1 { font-size: 26px; }
}

/* ---------- primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.h-sm { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.sec-h { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-top: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-md); font-weight: 700; white-space: nowrap; border: 1px solid transparent; transition: background .12s; }
.btn-sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: var(--r-sm); }
.btn-xl { height: 56px; font-size: 18px; border-radius: var(--r-lg); }
.btn-primary { background: var(--accent); color: var(--on-accent); } .btn-primary:hover { background: var(--accent-strong); }
.btn-secondary { background: var(--surface); border-color: var(--border-input); color: var(--text); } .btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { color: var(--text); } .btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: #fff; }
.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.wide { width: 100%; }
.link { color: var(--text); text-decoration: none; } .link:hover { color: var(--accent); }
button.link.left { display: flex; flex-direction: column; align-items: flex-start; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill-gold { background: var(--gold-soft); color: var(--gold); } .pill-pr { background: var(--pr-soft); color: var(--pr); } .pill-soft { background: var(--surface-2); color: var(--muted); }
.av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--av); color: #fff; font-weight: 700; flex: none; object-fit: cover; letter-spacing: .3px; }
.stack { display: inline-flex; } .stack .av { border: 2px solid var(--surface); margin-left: -6px; } .stack .av:first-child { margin-left: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { padding: 10px 12px; font-weight: 700; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar.lg { height: 10px; border-radius: 5px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.warn i { background: var(--warn); }
.warn-t { color: var(--warn); margin-top: 4px; }
.ring-bg { fill: none; stroke: var(--surface-2); } .ring-fg { fill: none; stroke: var(--accent); stroke-linecap: round; }
.empty { text-align: center; padding: 40px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty p { color: var(--muted); max-width: 44ch; }
.page-head { display: flex; align-items: center; gap: 8px; }
.ph-t { flex: 1; min-width: 0; } .ph-t p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.ph-r { display: flex; gap: 6px; }
.row-end { display: flex; justify-content: flex-end; }
.row-btn { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--r-md); width: 100%; }
.row-btn:hover, .row-btn.cur { background: var(--surface-2); }
.rank { width: 22px; text-align: center; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 460px); pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: var(--r-md); box-shadow: var(--pop); font-weight: 600; font-size: 14px; transition: opacity .3s, transform .3s; }
.toast.out { opacity: 0; transform: translateY(8px); }
.confirm { border: 1px solid var(--danger); border-radius: var(--r-md); padding: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); }
.confirm div { display: flex; gap: 8px; }
.pro-lock { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: var(--r-lg); background: var(--gold-soft); color: var(--text); }
.pro-lock > .ic { color: var(--gold); margin-top: 2px; } .pro-lock div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; } .pro-lock p { font-size: 13px; color: var(--muted); }

/* ---------- stats ---------- */
.stats-row { display: flex; gap: 22px; flex-wrap: wrap; }
.stat-l { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat-v { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-v small { font-size: 15px; color: var(--muted); margin-left: 3px; font-weight: 500; }
.big-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.big-stats .stat-v { font-size: 34px; }
.big-stats.sm .stat-v { font-size: 26px; }
@media (max-width: 560px) { .big-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px 16px; margin: 0; padding-top: 12px; border-top: 1px solid var(--border); }
.kv div { display: flex; flex-direction: column; gap: 1px; min-width: 0; } .kv dt { color: var(--muted); font-size: 12px; font-weight: 600; } .kv dd { margin: 0; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.mini-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); } .mini-stats b { color: var(--text); font-size: 16px; font-family: var(--font-display); }

/* ---------- feed ---------- */
.feed-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; gap: 18px; align-items: start; }
.feed-l, .feed-r { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 76px; }
.feed-c { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 1060px) { .feed-grid { grid-template-columns: 240px minmax(0, 1fr); } .feed-r { display: none; } }
@media (max-width: 760px) { .feed-grid { grid-template-columns: minmax(0, 1fr); } .feed-l { position: static; } .feed-l .me-card, .feed-l .card:nth-child(3) { display: none; } }
.me-card { align-items: center; text-align: center; }
.me-counts { display: flex; gap: 4px; width: 100%; justify-content: space-around; }
.me-counts.left { justify-content: flex-start; gap: 20px; margin-top: 6px; }
.me-counts button { display: flex; flex-direction: column; align-items: center; } .me-counts.left button { align-items: flex-start; }
.me-counts b { font-family: var(--font-display); font-size: 20px; } .me-counts span { font-size: 12px; color: var(--muted); }
.latest { width: 100%; text-align: left; border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.week-strip { display: flex; justify-content: space-between; }
.ws-d { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 28px; }
.ws-dot { border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: block; height: 26px; }
.ws-dot.on { background: var(--accent); border-color: var(--accent); }
.ws-d { height: 46px; justify-content: flex-end; }
.ws-l { font-size: 11px; color: var(--muted); font-weight: 700; }
.goal-row { display: flex; gap: 10px; align-items: center; }
.goal-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
.ch-mini { display: flex; gap: 10px; align-items: center; width: 100%; padding: 4px 0; text-align: left; }
.ch-mini b { display: block; font-size: 13px; }
.ch-badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold); flex: none; }
.ch-badge.sm { width: 34px; height: 34px; }
.ath-row { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.ath-row.me { background: var(--accent-soft); border-radius: var(--r-md); padding: 6px 8px; }
.ath-row b { display: block; font-size: 14px; }
.club-badge { border-radius: 12px; display: grid; place-items: center; background: var(--cb); color: #fff; flex: none; }

.act-card { padding: 16px 16px 10px; gap: 10px; }
.ac-head { display: flex; gap: 10px; align-items: center; }
.ac-who { min-width: 0; } .ac-who .muted { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.vis { display: inline-flex; color: var(--muted); }
.ac-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; text-align: left; }
.ac-title:hover { color: var(--accent); }
.ac-desc { color: var(--text); }
.ach { display: flex; gap: 6px; flex-wrap: wrap; }
.ac-map { display: block; border-radius: var(--r-md); overflow: hidden; position: relative; width: 100%; }
.ac-photo { position: absolute; right: 8px; bottom: 8px; width: 28%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-sm); border: 2px solid var(--surface); max-width: 100%; }
.ac-photo-big { border-radius: var(--r-md); width: 100%; max-height: 360px; object-fit: cover; }
.ac-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kudos-list { display: inline-flex; align-items: center; gap: 6px; }
.ac-actions { display: flex; gap: 2px; }
.kudo.on { color: var(--accent); } .kudo.on .ic { fill: var(--accent-soft); }

/* ---------- maps ---------- */
.map { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; max-width: 100%; background: var(--m-land); }
.map-lg { aspect-ratio: 900 / 420; }
.m-land { fill: var(--m-land); } .m-park { fill: var(--m-park); } .m-water { fill: var(--m-water); }
.m-street { stroke: var(--m-street); fill: none; } .m-avenue { stroke: var(--m-avenue); fill: none; }
.m-halo { stroke: var(--m-halo); fill: none; stroke-linejoin: round; stroke-linecap: round; opacity: .9; }
.m-route { stroke: var(--m-route); fill: none; stroke-linejoin: round; stroke-linecap: round; }
.m-route.m-seg { stroke: var(--m-seg); }
.m-route.m-run { stroke: var(--sport-run); } .m-route.m-ride { stroke: var(--sport-ride); }
.m-route.m-plan { stroke: var(--muted); stroke-dasharray: 2 6; opacity: .7; }
.m-route.m-faint { stroke: var(--m-route); opacity: .5; }
.heat .m-route.m-heat { stroke: var(--m-route); opacity: .22; }
.m-start { fill: var(--accent); stroke: var(--surface); } .m-end { fill: var(--surface); stroke: var(--text); } .m-end-dot { fill: var(--text); }
.m-pin { fill: var(--surface); stroke: var(--m-route); }
.m-km circle { fill: var(--surface); stroke: var(--text); } .m-km text { fill: var(--text); font-family: var(--font-body); font-weight: 700; }
.m-zone { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-dasharray: 6 4; }
.m-me { fill: var(--sport-ride); stroke: var(--surface); } .m-me-halo { fill: var(--sport-ride); opacity: .2; }
.m-cursor { fill: var(--surface); stroke: var(--text); }
.map-note { padding: 8px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; border-top: 1px solid var(--border); }
.map-empty { padding: 40px; text-align: center; color: var(--muted); background: var(--surface-2); }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart-wrap { touch-action: pan-y; cursor: crosshair; }
.c-grid { stroke: var(--border); stroke-width: 1; } .c-axis { stroke: var(--border-input); stroke-width: 1; }
.c-lbl { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.c-val { fill: var(--text); font-size: 11px; font-weight: 700; font-family: var(--font-body); }
.c-area { fill: var(--muted); opacity: .16; } .c-line { fill: none; stroke: var(--muted); stroke-width: 1.6; }

/* core.js: helpers, geography, terrain, formatting. No dependencies. */
'use strict';

const LAT0 = 38.7223, LON0 = -9.1393;          // demo city origin
const M_PER_DEG_LAT = 111320;
const M_PER_DEG_LON = 111320 * Math.cos(LAT0 * Math.PI / 180);

function toXY(lat, lon) { return [(lon - LON0) * M_PER_DEG_LON, (lat - LAT0) * M_PER_DEG_LAT]; }
function toLL(x, y) { return [LAT0 + y / M_PER_DEG_LAT, LON0 + x / M_PER_DEG_LON]; }

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* Terrain of the demo city, in metres. River to the south, a hill (the lookout)
   near the centre, a bigger forested ridge to the north-west. */
const RIVER_Y = -1650;
function terrain(x, y) {
  const g = (cx, cy, amp, s) => amp * Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * s * s));
  let h = 8 + g(1300, 950, 92, 620) + g(-2600, 2300, 165, 1150) + g(-6500, 3600, 260, 2200) + g(4200, 2600, 55, 900);
  h += 4 * Math.sin(x / 260) * Math.cos(y / 310) + 3 * Math.sin((x + y) / 530);
  const toRiver = y - RIVER_Y;
  if (toRiver < 400) h *= Math.max(0.12, toRiver / 400);
  return Math.max(1.5, h);
}
function isWater(x, y) { return y < RIVER_Y - 60 * Math.sin(x / 900); }

/* Park cells on a 320 m grid, deterministic. */
function isPark(cx, cy) {
  if (Math.hypot(cx * 320 + 2600, cy * 320 - 2300) < 1300) return true;
  if (Math.hypot(cx * 320 + 6500, cy * 320 - 3600) < 2200) return true;
  const r = mulberry32(hashStr(cx + ':' + cy))();
  return r > 0.9;
}

const GRID = 160;                               // street spacing in metres
function snap(v) { return Math.round(v / GRID) * GRID; }

/* ---------- formatting ---------- */

  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function distUnit() { return S.units === 'imperial' ? 'mi' : 'km'; }
function elevUnit() { return S.units === 'imperial' ? 'ft' : 'm'; }
function distVal(m) { return S.units === 'imperial' ? m / 1609.344 : m / 1000; }
function fmtDist(m, d = 2) { const v = distVal(m); return (v >= 100 ? NF0.format(v) : nf(d).format(v)); }
function fmtDistU(m, d = 2) { return fmtDist(m, d) + ' ' + distUnit(); }
function fmtElev(m) { return NF0.format(S.units === 'imperial' ? m * 3.28084 : m); }
function fmtElevU(m) { return fmtElev(m) + ' ' + elevUnit(); }
function fmtDur(s, long) {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (long) return h ? `${h}h ${m}min` : `${m}min ${sec}s`;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}
function paceSecPerUnit(m, s) { if (!m) return 0; return s / distVal(m); }
function fmtPace(m, s) {

  p = Math.round(p);
  return `${Math.floor(p / 60)}:${String(p % 60).padStart(2, '0')}`;
}

function fmtSpeed(m, s) { if (!s) return '–'; return NF1.format(distVal(m) / (s / 3600)); }

function usesPace(sport) { return sport === 'run' || sport === 'walk' || sport === 'hike' || sport === 'trail_run'; }
function fmtSwim(m, s) { if (!m) return '–'; const p = Math.round(s / (m / 100)); return `${Math.floor(p / 60)}:${String(p % 60).padStart(2, '0')}`; }

  if (sport === 'swim') return { label: 'Ritmo', val: fmtSwim(m, s), unit: '/100 m' };
  if (usesPace(sport)) return { label: 'Ritmo', val: fmtPace(m, s), unit: '/' + distUnit() };
  return { label: 'Velocidade', val: fmtSpeed(m, s), unit: S.units === 'imperial' ? 'mi/h' : 'km/h' };
}
function fmtTempo(sport, m, s) { const t = tempo(sport, m, s); return t.val + ' ' + t.unit; }

const DTF_DAY = new Intl.DateTimeFormat('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' });
const DTF_SHORT = new Intl.DateTimeFormat('pt-PT', { day: 'numeric', month: 'short' });
const DTF_TIME = new Intl.DateTimeFormat('pt-PT', { hour: '2-digit', minute: '2-digit' });

function startOfMonth(t) { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
function startOfYear(t) { return new Date(new Date(t).getFullYear(), 0, 1).getTime(); }
function fmtWhen(t) {
  const today = startOfDay(Date.now()), day = startOfDay(t);
  const time = DTF_TIME.format(t);
  if (day === today) return `Hoje às ${time}`;
  if (day === today - 864e5) return `Ontem às ${time}`;
  if (today - day < 6 * 864e5) return `${cap(DTF_WD.format(t))} às ${time}`;
  return `${DTF_DAY.format(t)} às ${time}`;
}
function fmtAgo(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'agora';
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  if (s < 7 * 86400) return `há ${Math.floor(s / 86400)} d`;
  return DTF_SHORT.format(t);
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function uid(p) { return p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }

/* seed.js: the demo city, its routes and segments, fictional athletes and a

'use strict';

function loopPts(cx, cy, rx, ry, n, a0, wob, seed) {
  const r = mulberry32(seed), out = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (i / n) * Math.PI * 2, k = 1 + wob * (r() - 0.5);
    out.push([Math.round(cx + Math.cos(a) * rx * k), Math.round(cy + Math.sin(a) * ry * k)]);
  }
  out[n] = out[0].slice();
  return out;
}
function wigglyLine(x0, x1, y, step, amp, per) {
  const out = [], dir = Math.sign(x1 - x0);
  for (let x = x0; dir > 0 ? x <= x1 : x >= x1; x += dir * step) out.push([x, Math.round(y + amp * Math.sin(x / per))]);
  if (out[out.length - 1][0] !== x1) out.push([x1, Math.round(y + amp * Math.sin(x1 / per))]);
  return out;
}

/* ---------- track synthesis ---------- */
function densify(pts, step = 5) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / step));
    for (let k = 0; k < n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}
function pathLength(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }

/* A cursor that walks a polyline by distance. */
function makeWalker(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = cum[cum.length - 1];
  let j = 0;
  return {
    total,
    at(s) {
      s = clamp(s, 0, total);
      if (s < cum[j]) j = 0;
      while (j < cum.length - 2 && cum[j + 1] < s) j++;
      const seg = cum[j + 1] - cum[j] || 1, f = (s - cum[j]) / seg;
      return [pts[j][0] + (pts[j + 1][0] - pts[j][0]) * f, pts[j][1] + (pts[j + 1][1] - pts[j][1]) * f];
    },
  };
}

const BASE_SPEED = { run: 3.05, trail_run: 2.45, ride: 7.6, walk: 1.42, hike: 1.2 };
const HR_REST = 52, HR_MAX = 188;

function synthTrack(routePts, sport, ability, seed, withHr, interval = 4) {
  const r = mulberry32(seed), w = makeWalker(routePts);
  const base = BASE_SPEED[sport] * ability, out = [];
  let s = 0, t = 0, noise = 0, ox = 0, oy = 0, hr = 92, lastEle = null;
  const fatigue = 0.04 * (w.total / 10000);
  while (true) {
    const [x, y] = w.at(s);
    const e = terrain(x, y), ahead = w.at(s + 15), grade = (terrain(ahead[0], ahead[1]) - e) / 15;
    noise = noise * 0.9 + (r() - 0.5) * 0.06;
    ox = clamp(ox * 0.85 + (r() - 0.5) * 1.6, -4, 4); oy = clamp(oy * 0.85 + (r() - 0.5) * 1.6, -4, 4);
    const gk = sport === 'ride' ? (grade > 0 ? 9 : 5) : (grade > 0 ? 4.2 : 1.8);
    let v = base * (1 + noise) * (1 - gk * grade) * (1 - fatigue * (s / w.total));
    v = clamp(v, base * 0.35, base * (sport === 'ride' ? 1.9 : 1.25));
    if (withHr) {
      const intensity = clamp(0.62 + 0.25 * (v / base - 1) + 3.2 * Math.max(0, grade) + 0.1 * (s / w.total), 0.45, 0.98);
      hr += (HR_REST + (HR_MAX - HR_REST) * intensity - hr) * 0.08;
    }
    const ll = toLL(x + ox, y + oy);
    const ele = lastEle == null ? e : lastEle * 0.6 + e * 0.4;
    lastEle = ele;
    out.push([+ll[0].toFixed(6), +ll[1].toFixed(6), +(ele + (r() - 0.5) * 0.4).toFixed(1), t, withHr ? Math.round(hr) : 0]);
    if (s >= w.total) break;
    s = Math.min(w.total, s + v * interval);
    t += interval;
  }
  return out;
}

/* analysis.js: everything computed from a GPS stream. Pure functions plus caches. */
'use strict';

const _trackCache = new Map(), _anCache = new Map(), _xyCache = new Map();

  let t = _trackCache.get(a.id);
  if (!t) {

    t = synthTrack(route.pts, a.sport === 'trail_run' ? 'trail_run' : a.sport, a.gen.ability, a.gen.seed, a.gen.hr);

}

const ZONES = [0.6, 0.7, 0.8, 0.9];          // fractions of max HR
const ZONE_NAMES = ['Recuperação', 'Resistência', 'Ritmo', 'Limiar', 'Anaeróbio'];

    const m = a.manual || { dist: 0, time: 0, elev: 0 };

    const minV = a.sport === 'ride' ? 1 : 0.45;
    const zones = [0, 0, 0, 0, 0];
    let refEle = t[0][2];
    for (let i = 1; i < n; i++) {
      const d = haversine(t[i - 1][0], t[i - 1][1], t[i][0], t[i][1]);
      const dt = t[i][3] - t[i - 1][3];
      cum[i] = cum[i - 1] + d;
      if (dt > 0) {
        const v = d / dt;

const _segCache = new Map();
function segmentInfo(sg) {

    if (i) L += Math.hypot(d[i][0] - d[i - 1][0], d[i][1] - d[i - 1][1]);
    prof.push([L, terrain(d[i][0], d[i][1])]);

  for (let i = 0, j = 0; i < prof.length; i++) {

const _effCache = new Map();

      const near = (p, q, r) => Math.abs(p[0] - q[0]) < r && Math.abs(p[1] - q[1]) < r && Math.hypot(p[0] - q[0], p[1] - q[1]) < r;

/* ---------- training load ---------- */

  const today = startOfDay(Date.now()), load = new Map();
  acts.forEach((a) => { const d = startOfDay(a.start); load.set(d, (load.get(d) || 0) + analyze(a).effort); });

  const out = [], first = today - (days + 60) * 864e5;
  for (let d = first; d <= today; d += 864e5) {
    const dd = startOfDay(d + 3 * 36e5), l = load.get(dd) || 0;

/* ---------- GPX ---------- */
function parseGPX(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('O ficheiro não é um GPX válido.');
  const pts = [...doc.getElementsByTagName('trkpt'), ...doc.getElementsByTagName('rtept')];
  if (pts.length < 2) throw new Error('O ficheiro não tem pontos de percurso.');
  let t0 = null;
  const out = pts.map((p, i) => {
    const lat = parseFloat(p.getAttribute('lat')), lon = parseFloat(p.getAttribute('lon'));
    const ele = parseFloat(p.getElementsByTagName('ele')[0]?.textContent || '0');
    const tt = p.getElementsByTagName('time')[0]?.textContent;
    let sec = i * 4;
    if (tt) { const ms = Date.parse(tt); if (t0 == null) t0 = ms; sec = Math.round((ms - t0) / 1000); }
    const hrEl = [...p.getElementsByTagName('*')].find((e) => /(^|:)hr$/i.test(e.tagName));
    return [lat, lon, ele, sec, hrEl ? parseInt(hrEl.textContent, 10) || 0 : 0];
  }).filter((p) => isFinite(p[0]) && isFinite(p[1]));
  const name = doc.getElementsByTagName('name')[0]?.textContent?.trim();
  const type = (doc.getElementsByTagName('type')[0]?.textContent || '').toLowerCase();
  const sport = /bik|cycl|ride/.test(type) ? 'ride' : /walk/.test(type) ? 'walk' : /hik/.test(type) ? 'hike' : 'run';
  return { track: out, start: t0 || Date.now(), name, sport };
}

  const body = pts.map(([x, y]) => { const [lat, lon] = toLL(x, y); return `    <rtept lat="${lat.toFixed(6)}" lon="${lon.toFixed(6)}"><ele>${terrain(x, y).toFixed(1)}</ele></rtept>`; }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Passo" xmlns="http://www.topografix.com/GPX/1/1">\n  <rte><name>${esc(name)}</name><type>${sport}</type>\n${body}\n  </rte>\n</gpx>\n`;
}

const _sessCache = new Map();

function sessionData(sess) {

  if (hit && hit.v === (sess.v || 0)) return hit;
  let track = [], ranges = [];
  if (sess.track) { track = sess.track; ranges = sess.ranges || []; }
  else {
    let t0 = 0;
    const push = (pts, kind, label, aid) => {
      if (!pts || !pts.length) return;
      const i0 = track.length, base = pts[0][3];
      pts.forEach((p) => track.push([p[0], p[1], p[2], t0 + p[3] - base, p[4]]));
      t0 = track[track.length - 1][3] + 4;
      ranges.push({ kind, label, i0, i1: track.length - 1, aid });
    };
    sess.parts.forEach((p) => {
      if (p.kind === 'wait') {
        const last = track[track.length - 1]; if (!last) return;
        const pts = []; for (let s = 0; s <= p.seconds; s += 30) pts.push([last[0], last[1], last[2], s, last[4] ? Math.max(70, last[4] - s / 6) : 0]);

      } else if (p.kind === 'activity') {
        const a = activity(p.aid); if (!a) return;
        push(trackOf(a), 'activity', a.name, a.id);
      } else {
        const r = BASE_ROUTES[p.gen.route];
        push(synthTrack(r.pts, p.sport, p.gen.ability, p.gen.seed, p.gen.hr), p.kind, p.label);

  const res = { v: sess.v || 0, track, ranges, cum, dist, time: track.length ? track[track.length - 1][3] : 0 };
  _sessCache.set(sess.id, res);
  return res;

/* Steps and cadence: from the device when it gives them, else estimated
   from speed (running ~150-190 spm, walking ~95-125 spm). */
function activitySteps(a) {
  const an = analyze(a), fam = sportFamily(a.sport);
  if (a.steps) return { steps: a.steps, cadence: an.moving ? Math.round(a.steps / (an.moving / 60)) : 0, measured: true };
  if ((fam !== 'run' && fam !== 'walk') || !an.moving || !an.dist) return null;
  const v = an.dist / an.moving;

/* store.js: the data layer. Same operations the real API will have

'use strict';

const LS_KEY = 'passo.db.v3';
let DB = null;

function load() {

let _saveT = 0;

  acts.forEach((a) => { if (a.start >= from && a.start < to) { const x = analyze(a); r.count++; r.dist += x.dist; r.time += x.moving; r.gain += x.gain; r.effort += x.effort; } });

/* Segment leaderboard: best effort per athlete. */
function allEfforts(segId) {
  const sg = DB.segments.find((s) => s.id === segId);
  const out = [];
  DB.activities.forEach((a) => { if (canView(a) && segSportOk(sg, a.sport)) effortsFor(a, DB.segments).forEach((e) => { if (e.seg === segId) out.push(e); }); });

}

  if (filter === 'f' || filter === 'm') eff = eff.filter((e) => user(e.uid).sex === filter);
  if (filter === 'year') eff = eff.filter((e) => e.at >= yr);
  if (filter === 'following') { const fo = new Set([me(), ...followingOf(me())]); eff = eff.filter((e) => fo.has(e.uid)); }
  if (filter.startsWith('club:')) { const c = DB.clubs.find((x) => x.id === filter.slice(5)); eff = eff.filter((e) => c.members.includes(e.uid)); }

  eff.forEach((e) => { const b = best.get(e.uid); if (!b || e.time < b.time) best.set(e.uid, e); });

  const since = Date.now() - 90 * 864e5, cnt = new Map();
  allEfforts(segId).forEach((e) => { if (e.at >= since) cnt.set(e.uid, (cnt.get(e.uid) || 0) + 1); });

/* charts.js: the demo city map and every chart, as SVG strings. */
'use strict';

function decimate(arr, max) {
  if (arr.length <= max) return arr;
  const step = arr.length / max, out = [];
  for (let i = 0; i < max; i++) out.push(arr[Math.floor(i * step)]);
  out.push(arr[arr.length - 1]);
  return out;
}

function bboxOf(lines, padM = 120) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  lines.forEach((l) => l.forEach(([x, y]) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }));
  if (!isFinite(x0)) { x0 = -1000; x1 = 1000; y0 = -1000; y1 = 1000; }
  return [x0 - padM, y0 - padM, x1 + padM, y1 + padM];
}

/* Background layers for a world-space window [x0,y0,x1,y1]. Coordinates are
   emitted in world metres with y flipped (svg y = -y), so callers set viewBox. */
function mapLayers(x0, y0, x1, y1, pxPerM) {
  let s = `<rect x="${x0}" y="${-y1}" width="${x1 - x0}" height="${y1 - y0}" class="m-land"/>`;
  // parks
  const c0x = Math.floor(x0 / 320), c1x = Math.ceil(x1 / 320), c0y = Math.floor(y0 / 320), c1y = Math.ceil(y1 / 320);
  if ((c1x - c0x) * (c1y - c0y) < 6000) {
    let d = '';
    for (let cx = c0x; cx <= c1x; cx++) for (let cy = c0y; cy <= c1y; cy++) if (isPark(cx, cy)) { const r = 200 + (hashStr(cx + '/' + cy) % 70); d += `M${cx * 320 + 160 - r} ${-(cy * 320 + 160)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0z`; }
    if (d) s += `<path d="${d}" class="m-park"/>`;
  }
  // streets: fine grid when zoomed in, avenues otherwise
  const step = GRID * pxPerM >= 12 ? GRID : GRID * 4;
  let d = '', dm = '';
  for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) (x % (GRID * 4) === 0 ? (dm += `M${x} ${-y1}V${-Math.max(y0, RIVER_Y)}`) : (d += `M${x} ${-y1}V${-Math.max(y0, RIVER_Y)}`));
  for (let y = Math.ceil(Math.max(y0, RIVER_Y) / step) * step; y <= y1; y += step) (y % (GRID * 4) === 0 ? (dm += `M${x0} ${-y}H${x1}`) : (d += `M${x0} ${-y}H${x1}`));
  const sw = 1 / pxPerM;
  s += `<path d="${d}" class="m-street" stroke-width="${(1.2 * sw).toFixed(2)}"/><path d="${dm}" class="m-avenue" stroke-width="${(2.6 * sw).toFixed(2)}"/>`;
  // riverside path
  s += `<path d="M${x0} ${1520}H${x1}" class="m-avenue" stroke-width="${(3 * sw).toFixed(2)}"/>`;
  // river
  if (y0 < RIVER_Y + 80) {
    let w = `M${x0} ${-(y0 - 10)}`;
    const n = 60;
    for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; w += `L${x.toFixed(0)} ${(-(RIVER_Y - 60 * Math.sin(x / 900))).toFixed(0)}`; }
    w += `L${x1} ${-(y0 - 10)}Z`;
    s += `<path d="${w}" class="m-water"/>`;
  }
  return s;
}

function polyD(xy) { let d = ''; for (let i = 0; i < xy.length; i++) d += (i ? 'L' : 'M') + xy[i][0].toFixed(1) + ' ' + (-xy[i][1]).toFixed(1); return d; }

/* A static map. lines: [{xy, cls}] in world metres. */
function mapSVG({ lines = [], markers = [], w = 600, h = 300, pad = 140, bbox, cls = '', id = '', label = 'Mapa do percurso', extra = '' }) {
  const all = lines.map((l) => l.xy);
  let [x0, y0, x1, y1] = bbox || bboxOf(all, pad);
  // fit to aspect
  const bw = x1 - x0, bh = y1 - y0, ar = w / h;
  if (bw / bh > ar) { const nh = bw / ar; y0 -= (nh - bh) / 2; y1 += (nh - bh) / 2; } else { const nw = bh * ar; x0 -= (nw - bw) / 2; x1 += (nw - bw) / 2; }
  const ppm = w / (x1 - x0), sw = 1 / ppm;
  let s = `<svg class="map ${cls}" ${id ? `id="${id}"` : ''} viewBox="${x0.toFixed(0)} ${(-y1).toFixed(0)} ${(x1 - x0).toFixed(0)} ${(y1 - y0).toFixed(0)}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(label)}">`;
  s += mapLayers(x0, y0, x1, y1, ppm);
  lines.forEach((l) => {
    const d = polyD(decimate(l.xy, l.max || 700));
    const lw = (l.w || 3.4) * sw;
    if (!l.noHalo) s += `<path d="${d}" class="m-halo" stroke-width="${(lw + 3 * sw).toFixed(2)}"/>`;
    s += `<path d="${d}" class="m-route ${l.cls || ''}" stroke-width="${lw.toFixed(2)}"/>`;
  });
  markers.forEach((m) => {
    const r = (m.r || 6) * sw, [x, y] = m.xy;
    if (m.kind === 'start') s += `<circle cx="${x}" cy="${-y}" r="${r}" class="m-start" stroke-width="${2 * sw}"/>`;
    else if (m.kind === 'end') s += `<circle cx="${x}" cy="${-y}" r="${r}" class="m-end" stroke-width="${2 * sw}"/><circle cx="${x}" cy="${-y}" r="${r * 0.4}" class="m-end-dot"/>`;
    else if (m.kind === 'km') s += `<g class="m-km"><circle cx="${x}" cy="${-y}" r="${8 * sw}" stroke-width="${1.5 * sw}"/><text x="${x}" y="${-y + 3.6 * sw}" font-size="${10 * sw}" text-anchor="middle">${m.text}</text></g>`;
    else if (m.kind === 'zone') s += `<circle cx="${x}" cy="${-y}" r="${m.radius}" class="m-zone" stroke-width="${1.5 * sw}"/>`;
    else if (m.kind === 'me') s += `<circle cx="${x}" cy="${-y}" r="${14 * sw}" class="m-me-halo"/><circle cx="${x}" cy="${-y}" r="${6 * sw}" class="m-me" stroke-width="${2.5 * sw}"/>`;
    else if (m.kind === 'cursor') s += `<circle id="map-cursor" cx="${x}" cy="${-y}" r="${6 * sw}" class="m-cursor" stroke-width="${2.5 * sw}" visibility="hidden"/>`;
    else if (m.kind === 'pin') s += `<circle cx="${x}" cy="${-y}" r="${(m.r || 4.5) * sw}" class="m-pin" stroke-width="${1.6 * sw}"/>`;
  });
  s += extra;
  return s + '</svg>';
}

function activityMap(a, { w = 600, h = 320, kms = false, cursor = false, segment = null, hideZone = false, cls = '' } = {}) {
  let xy = xyOf(a);
  if (!xy) return '';
  const z = DB.settings.privacyZone;
  if (hideZone && z.on && a.uid === me()) xy = trimZone(xy, z);
  if (xy.length < 2) return `<div class="map-empty">Percurso escondido pela zona de privacidade</div>`;
  const markers = [{ kind: 'start', xy: xy[0] }, { kind: 'end', xy: xy[xy.length - 1] }];
  if (kms) {
    const an = analyze(a), unit = S.units === 'imperial' ? 1609.344 : 1000, full = xyOf(a);
    let k = 1;
    for (let i = 0; i < an.cum.length && k < 60; i++) if (an.cum[i] >= k * unit) { markers.push({ kind: 'km', xy: full[i], text: k }); k++; }
  }
  if (cursor) markers.push({ kind: 'cursor', xy: xy[0] });
  const lines = [{ xy, cls: '' }];
  if (segment) lines.push({ xy: xyOf(a).slice(segment.i, segment.j + 1), cls: 'm-seg', w: 5, noHalo: true });
  return mapSVG({ lines, markers, w, h, cls, label: `Mapa de ${a.name}` });
}
function trimZone(xy, z) {
  const inZ = (p) => Math.hypot(p[0] - z.x, p[1] - z.y) < z.radius;
  let i = 0, j = xy.length - 1;
  while (i < xy.length && inZ(xy[i])) i++;
  while (j > i && inZ(xy[j])) j--;
  return xy.slice(i, j + 1);
}

/* ---------- charts ---------- */
function niceTicks(min, max, n = 4) {
  const span = max - min || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

/* xs ascending, ys values. opts: invert (pace), fmtY, fmtX, cls, id */
function areaChart(xs, ys, { w = 640, h = 160, fmtY = (v) => NF0.format(v), fmtX = (v) => v, cls = 'c-elev', invert = false, id = '', yMin, yMax, label = '' } = {}) {
  if (xs.length < 2) return '';
  const L = 44, R = 10, T = 10, B = 24, iw = w - L - R, ih = h - T - B;
  let lo = yMin != null ? yMin : Math.min(...ys), hi = yMax != null ? yMax : Math.max(...ys);
  if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
  const padY = (hi - lo) * 0.08; lo -= padY; hi += padY;
  const X = (v) => L + (v - xs[0]) / (xs[xs.length - 1] - xs[0]) * iw;
  const Y = (v) => invert ? T + (v - lo) / (hi - lo) * ih : T + (1 - (v - lo) / (hi - lo)) * ih;
  const idx = decimate(xs.map((_, i) => i), 400);
  let line = ''; idx.forEach((i, k) => { line += (k ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(ys[i]).toFixed(1); });
  const base = invert ? T : T + ih;
  const area = line + `L${X(xs[xs.length - 1]).toFixed(1)} ${base}L${X(xs[0]).toFixed(1)} ${base}Z`;
  let g = '';
  niceTicks(lo, hi, 3).forEach((v) => { const y = Y(v); if (y < T - 1 || y > T + ih + 1) return; g += `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" class="c-grid"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" class="c-lbl">${fmtY(v)}</text>`; });
  niceTicks(xs[0], xs[xs.length - 1], 5).forEach((v) => { const x = X(v); if (x > w - R - 10) return; g += `<text x="${x}" y="${h - 6}" text-anchor="middle" class="c-lbl">${fmtX(v)}</text>`; });
  return `<svg class="chart ${cls}" ${id ? `id="${id}"` : ''} viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" data-l="${L}" data-iw="${iw}" data-x0="${xs[0]}" data-x1="${xs[xs.length - 1]}">${g}<path d="${area}" class="c-area"/><path d="${line}" class="c-line"/><line class="c-cross" x1="0" x2="0" y1="${T}" y2="${T + ih}" visibility="hidden"/></svg>`;
}

function barChart(vals, labels, { w = 640, h = 150, fmt = (v) => NF0.format(v), hi = -1, cls = '' } = {}) {
  const L = 8, R = 8, T = 18, B = 22, iw = w - L - R, ih = h - T - B, n = vals.length, max = Math.max(...vals, 1e-9);
  const bw = iw / n, gap = Math.min(10, bw * 0.3);
  let s = `<svg class="chart c-bars ${cls}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de barras">`;
  s += `<line x1="${L}" x2="${w - R}" y1="${T + ih}" y2="${T + ih}" class="c-axis"/>`;
  vals.forEach((v, i) => {
    const bh = v / max * ih, x = L + i * bw + gap / 2, y = T + ih - bh;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - gap).toFixed(1)}" height="${Math.max(bh, v ? 2 : 0).toFixed(1)}" rx="2" class="${i === hi ? 'c-bar-hi' : 'c-bar'}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`;
    if (i === hi || (v === max && v > 0)) s += `<text x="${(x + (bw - gap) / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" class="c-val">${fmt(v)}</text>`;
    if (n <= 14 && (n <= 7 || i % 2 === (n - 1) % 2)) s += `<text x="${(x + (bw - gap) / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle" class="c-lbl">${esc(labels[i])}</text>`;
  });
  return s + '</svg>';
}

function multiLine(series, xs, { w = 720, h = 220, fmtX = (v) => v, zero = false } = {}) {
  const L = 36, R = 12, T = 12, B = 24, iw = w - L - R, ih = h - T - B;
  const all = series.flatMap((s) => s.ys);
  let lo = Math.min(...all, zero ? 0 : Infinity), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const X = (i) => L + i / (xs.length - 1) * iw, Y = (v) => T + (1 - (v - lo) / (hi - lo)) * ih;
  let s = `<svg class="chart c-multi" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de forma e frescura">`;
  niceTicks(lo, hi, 4).forEach((v) => { s += `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" class="${v === 0 ? 'c-axis' : 'c-grid'}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="c-lbl">${NF0.format(v)}</text>`; });
  const nl = 6; for (let k = 0; k <= nl; k++) { const i = Math.round(k / nl * (xs.length - 1)); s += `<text x="${X(i)}" y="${h - 6}" text-anchor="${k === 0 ? 'start' : k === nl ? 'end' : 'middle'}" class="c-lbl">${fmtX(xs[i])}</text>`; }
  series.forEach((se) => {
    let d = ''; se.ys.forEach((v, i) => { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
    if (se.area) s += `<path d="${d}L${X(se.ys.length - 1)} ${Y(Math.max(lo, 0))}L${X(0)} ${Y(Math.max(lo, 0))}Z" class="c-area ${se.cls}"/>`;
    s += `<path d="${d}" class="c-line ${se.cls}"/>`;
    const last = se.ys.length - 1;
    s += `<circle cx="${X(last)}" cy="${Y(se.ys[last])}" r="3.5" class="c-dot ${se.cls}"/>`;
  });
  return s + '</svg>';
}

function ring(pct, size = 64, stroke = 7, cls = '') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" class="ring-bg" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" class="ring-fg" stroke-width="${stroke}" stroke-dasharray="${(c * pct).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
}

function elevationFor(a) {
  const t = trackOf(a), an = analyze(a);
  const xs = [], ys = [];
  for (let i = 0; i < t.length; i++) { xs.push(distVal(an.cum[i])); ys.push(S.units === 'imperial' ? t[i][2] * 3.28084 : t[i][2]); }
  return { xs, ys };
}
function paceFor(a) {
  const t = trackOf(a), an = analyze(a), xs = [], ys = [], pace = usesPace(a.sport);
  const win = 6;
  for (let i = win; i < t.length; i++) {
    const d = an.cum[i] - an.cum[i - win], dt = t[i][3] - t[i - win][3];
    if (dt <= 0) continue;
    xs.push(distVal(an.cum[i]));
    ys.push(pace ? clamp(dt / distVal(d || 0.01), 120, 1200) : distVal(d) / (dt / 3600));
  }
  return { xs, ys, pace };

const APP_URL = 'https://claude.ai/artifact/YWWo8nGdZsjqCQyLorTM4d';

/* ---------- the room: other devices that have the app open ---------- */
let ROOM = null;
const PEERS = new Map();            // peer -> {snap, trail, seen}
async function initRoom() {
  try { ROOM = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('room') : null; } catch (e) { ROOM = null; }
  if (!ROOM) return;
  ROOM.onPeers((ch) => {
    const alive = new Set();
    ch.peers.forEach((p) => {
      const l = p.presence && p.presence.live;
      if (!l || p.isMe || typeof l !== 'object') return;
      alive.add(p.peer);
      const e = PEERS.get(p.peer) || { trail: [] };
      const lastT = e.trail.length ? e.trail[e.trail.length - 1][2] : -1;
      (Array.isArray(l.trail) ? l.trail : []).forEach((pt) => { if (Array.isArray(pt) && pt[2] > lastT) e.trail.push(pt); });
      if (e.trail.length > 4000) e.trail.splice(0, e.trail.length - 4000);
      e.snap = l; e.seen = Date.now();
      PEERS.set(p.peer, e);
    });
    [...PEERS.keys()].forEach((k) => { if (!alive.has(k)) PEERS.delete(k); });
    liveRerender();
  }, () => { });
}

const _frameCache = new Map();
function drawScene(ctx, w, h, x, y, phase) {

  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, hz);

        ctx.fillRect(side ? bx : bx - bw, hz - bh + 6 * sc, bw, bh);

}

/* Feature 5: follow several runners in the same race. */
function viewRace() {

        <label class="fld"><span>Percurso da prova</span><select id="race-course" name="course">${courseOptions().map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select></label>
        <fieldset class="fld"><legend>Atletas a seguir</legend><div class="pick-grid">${cand.map((u) => `<label class="pick"><input type="checkbox" name="runners" value="${u}" ${['u1', 'u3', 'u8', 'u5'].includes(u) ? 'checked' : ''}>${avatar(u, 28)}<span>${esc(user(u).name)}</span></label>`).join('')}</div></fieldset>
        <p class="muted sm">Na demonstração estes atletas são simulados no percurso. Quem estiver a partilhar uma sessão a sério noutro dispositivo também aparece.</p>

      </form>`;
  }
  const rc = R.race, course = coursePts(rc.course), L = pathLength(course);
  const runners = liveList().filter((s) => rc.ids.includes(s.id) || (!s.sim && s.phase === 'activity'));
  const rows = runners.map((s) => {
    const tr = (s.trail || []).map((p) => toXY(p[0], p[1])), pos = tr[tr.length - 1] || toXY(s.lat, s.lon);
    const pr = courseProgress(course, pos[0], pos[1], s.actDist / L);
    const avg = s.actDist > 50 ? s.actT / (s.actDist / 1000) : 0;
    return { s, tr, pos, covered: s.done ? L : Math.min(pr.covered, s.actDist + 60), avg };
  }).sort((a, b) => (b.s.done && a.s.done) ? a.s.actT - b.s.actT : b.covered - a.covered);
  const lead = rows[0];
  const colors = ['#d6336c', '#3461c9', '#0b7a57', '#b07c00', '#7b5cc4', '#1691b3', '#b5466b', '#9a6a22'];
  const lines = [{ xy: densify(course, 30), cls: 'm-plan-solid', w: 6, noHalo: true }];
  const extra = rows.map((r, i) => { const sw = (bboxOf([course], 250)[2] - bboxOf([course], 250)[0]) / 900; const [x, y] = r.pos; const ini = (r.s.name || '?').split(/\s+/).map((p) => p[0]).slice(0, 2).join(''); return `<g><circle cx="${x}" cy="${-y}" r="${11 * sw}" fill="${colors[i % colors.length]}" stroke="#fff" stroke-width="${2 * sw}"/><text x="${x}" y="${-y + 4 * sw}" font-size="${10 * sw}" text-anchor="middle" fill="#fff" font-weight="700">${esc(ini)}</text></g>`; }).join('');
  return `${pageHead(esc(rc.name), `${rows.length} atletas · ${fmtDistU(L, 1)}`, `<div class="ph-r"><button class="btn btn-ghost btn-sm danger" data-act="raceEnd">Parar de seguir</button></div>`)}
    <section class="card flush">${mapSVG({ lines, markers: [{ kind: 'start', xy: course[0] }, { kind: 'end', xy: course[course.length - 1] }], w: 900, h: 420, bbox: bboxOf([course], 250), extra, label: 'Mapa da prova com os atletas' })}</section>
    <div class="chips"><span class="muted sm">Velocidade da simulação:</span>${[1, 10, 30, 60].map((n) => `<button class="chip ${rc.speed === n ? 'on' : ''}" ${act('simSpeed', { n })}>${n}×</button>`).join('')}</div>
    <section class="card"><div class="tbl-wrap"><table class="tbl lb"><thead><tr><th>#</th><th>Atleta</th><th>Percorrido</th><th>Diferença</th><th>Ritmo atual</th><th>Ritmo médio</th><th>FC</th><th>Chegada prevista</th></tr></thead><tbody>
      ${rows.map((r, i) => { const gap = i && r.avg ? (lead.covered - r.covered) / 1000 * r.avg : 0; const left = L - r.covered; const k = R.race.speed; return `<tr><td><span class="dot" style="background:${colors[i % colors.length]}"></span>${i + 1}</td><td><button class="link ath-cell" ${act('raceFocus', { id: r.s.id })}>${esc(r.s.name || 'Atleta')}</button></td><td class="num">${r.s.done ? '<b class="ok">Chegou</b> ' + fmtDur(r.s.actT) : fmtDistU(r.covered, 2)}</td><td class="num">${i ? '+' + fmtDur(gap) : '–'}</td><td class="num">${r.s.pace && !r.s.done ? fmtPace(1000, r.s.pace) : '–'}</td><td class="num">${r.avg ? fmtPace(1000, r.avg) : '–'}</td><td class="num">${r.s.hr || '–'}</td><td class="num">${r.s.done ? '–' : r.avg ? DTF_TIME.format(Date.now() + left / 1000 * r.avg * 1000 / (r.s.sim ? k : 1)) : '–'}</td></tr>`; }).join('')}
    </tbody></table></div><p class="muted xs">A diferença é o tempo estimado que cada atleta demora a chegar ao ponto onde está o primeiro.</p></section>`;
}

/* Steps (feature 4): Samsung Health / Health Connect, CSV import, or estimates. */
function dayKey(t) { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function stepsSeries(days) {
  const out = [], today = startOfDay(Date.now());
  for (let i = days - 1; i >= 0; i--) {
    const t = today - i * 864e5, k = dayKey(t);
    const fromActs = DB.activities.filter((a) => a.uid === me() && startOfDay(a.start) === t).reduce((s, a) => s + ((activitySteps(a) || {}).steps || 0), 0);
    out.push({ t, k, steps: DB.steps[k] != null ? DB.steps[k] : 0, fromActs, synced: DB.steps[k] != null });
  }
  return out;
}
function trainingSteps() {
  const c = DB.settings.conn;
  const ser = stepsSeries(30), synced = ser.some((d) => d.synced);
  const vals = ser.map((d) => d.synced ? d.steps : d.fromActs);
  const avg = vals.reduce((s, v) => s + v, 0) / vals.length, goal = DB.settings.stepGoal || 10000;
  const today = vals[vals.length - 1];
  return `<section class="card"><div class="card-h"><h3>Passos</h3><span class="muted sm">${c.samsung ? 'Samsung Health ligado' : synced ? 'Importados de ficheiro' : 'Estimados só a partir das tuas atividades'}</span></div>
      <div class="goal-row">${ring(clamp(today / goal, 0, 1), 64, 7)}<div><b class="big num">${NF0.format(today)}</b> <span class="muted">hoje · objetivo ${NF0.format(goal)}</span><div class="muted sm">Média de 30 dias: ${NF0.format(avg)} por dia</div></div></div>
      ${barChart(vals.slice(-14), ser.slice(-14).map((d) => new Date(d.t).getDate() + ''), { h: 150, hi: 13, fmt: (v) => NF0.format(v) })}</section>
    ${c.samsung ? '' : `<section class="card"><div class="card-h"><h3>Ligar o Samsung Health</h3></div><p class="sm">Para veres todos os passos do dia, não só os das atividades.</p><div class="row-gap"><button class="btn btn-primary btn-sm" ${go('settings')}>Ir para ligações</button></div></section>`}
    <section class="card"><div class="card-h"><h3>Passos por atividade</h3></div>${DB.activities.filter((a) => a.uid === me() && activitySteps(a)).slice(0, 8).map((a) => { const st = activitySteps(a); return `<button class="row-btn" ${go('activity', { id: a.id })}>${icon(SPORTS[a.sport].icon, 18)}<span class="grow left">${esc(a.name)} <span class="muted sm">· ${DTF_SHORT.format(a.start)}</span></span><span class="num">${NF0.format(st.steps)} passos · ${st.cadence} ppm</span></button>`; }).join('')}</section>`;
}

/* views.js: every screen, as HTML strings. IDs match replica/recon.md. */
'use strict';

const AV_COLORS = ['#2f7d63', '#3d63c9', '#a4508b', '#b26b1f', '#2b8a9e', '#6b5bb8', '#9a4a3a', '#4f7a2a', '#7d5a2f', '#3a6e8f', '#8a3d63'];
function avatar(u, size = 40) {
  u = typeof u === 'string' ? user(u) : u;
  const ini = u.name.split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();
  const col = AV_COLORS[hashStr(u.id) % AV_COLORS.length];
  if (u.photo) return `<img class="av" src="${u.photo}" width="${size}" height="${size}" alt="" style="width:${size}px;height:${size}px">`;
  return `<span class="av" style="--av:${col};width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px" aria-hidden="true">${esc(ini)}</span>`;
}
const go = (view, params = {}) => `data-go="${view}" data-p='${esc(JSON.stringify(params))}'`;
const act = (name, params = {}) => `data-act="${name}" data-p='${esc(JSON.stringify(params))}'`;
function sportChip(s) { return `<span class="sport-chip" style="--sc:${SPORTS[s].color}">${icon(SPORTS[s].icon, 16)}${SPORTS[s].label}</span>`; }
function visIcon(v) { return v === 'only_me' ? `<span class="vis" title="Só tu">${icon('lock', 14)}</span>` : v === 'followers' ? `<span class="vis" title="Só seguidores">${icon('people', 14)}</span>` : ''; }
function stat(label, value, unit = '') { return `<div class="stat"><div class="stat-l">${label}</div><div class="stat-v">${value}${unit ? `<small>${unit}</small>` : ''}</div></div>`; }
function empty(title, body, cta = '') { return `<div class="empty"><h3>${title}</h3><p>${body}</p>${cta}</div>`; }
function proLock(what) {
  return `<div class="pro-lock">${icon('lock', 22)}<div><h3>${what} faz parte do plano Pro</h3><p>Ativa o plano Pro nas definições para desbloquear. Nesta demo é um interruptor.</p><button class="btn btn-primary btn-sm" ${go('settings')}>Ver planos</button></div></div>`;
}
function tabs(items, current, actName) {
  return `<div class="tabs" role="tablist">${items.map(([k, l]) => `<button role="tab" class="tab ${k === current ? 'on' : ''}" aria-selected="${k === current}" ${act(actName, { tab: k })}>${l}</button>`).join('')}</div>`;
}
function pageHead(title, sub = '', right = '', back = true) {
  return `<div class="page-head">${back ? `<button class="icon-btn back" data-act="back" aria-label="Voltar">${icon('back')}</button>` : ''}<div class="ph-t"><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right}</div>`;
}

/* ---------- S01 feed ---------- */
function activityCard(a) {
  const u = user(a.uid), an = analyze(a), k = kudosOf(a.id), cs = commentsOf(a.id), mine = a.uid === me();
  const effs = an.hasMap ? effortsFor(a, DB.segments) : [];
  const prs = effs.map(effortBadges).filter((b) => b.isPR).length;
  const crownsN = effs.filter((e) => { const c = crowns(e.seg); return (c.kom && c.kom.aid === a.id) || (c.qom && c.qom.aid === a.id); }).length;
  const hide = a.hideStats || {};
  const s3 = [stat('Distância', an.dist ? fmtDist(an.dist) : '–', an.dist ? distUnit() : '')];
  if (!hide.pace && an.dist) { const tp = tempo(a.sport, an.dist, an.moving); s3.push(stat(tp.label, tp.val, tp.unit)); }
  s3.push(stat('Tempo', fmtDur(an.moving, true)));
  if (an.hasMap && an.gain > 20) s3.push(stat('Desnível', fmtElev(an.gain), elevUnit()));
  return `<article class="card act-card">
    <div class="ac-head">
      <button class="av-btn" ${go('profile', { id: u.id })} aria-label="Perfil de ${esc(u.name)}">${avatar(u, 40)}</button>
      <div class="ac-who"><button class="link strong" ${go('profile', { id: u.id })}>${esc(u.name)}</button>
        <div class="muted sm">${icon(SPORTS[a.sport].icon, 14)} ${fmtWhen(a.start)}${u.city ? ' · ' + esc(u.city) : ''} ${visIcon(a.visibility)}</div></div>
    </div>
    <button class="ac-title" ${go('activity', { id: a.id })}>${esc(a.name)}</button>
    ${a.desc ? `<p class="ac-desc">${esc(a.desc)}</p>` : ''}
    <div class="stats-row">${s3.join('')}</div>
    ${a.kind === 'prova' || a.race ? `<div class="ach"><span class="pill pill-race">${icon('medal', 14)} Prova${a.race && a.race.official ? ' · tempo oficial ' + fmtDur(a.race.official) : ''}${a.race && a.race.pos ? ' · ' + a.race.pos + 'º' : ''}</span></div>` : ''}
    ${prs || crownsN ? `<div class="ach">${crownsN ? `<span class="pill pill-gold">${icon('crown', 14)} ${crownsN} ${crownsN > 1 ? 'coroas' : 'coroa'}</span>` : ''}${prs ? `<span class="pill pill-pr">${icon('medal', 14)} ${prs} ${prs > 1 ? 'recordes pessoais' : 'recorde pessoal'}</span>` : ''}</div>` : ''}
    ${an.hasMap ? `<button class="ac-map" ${go('activity', { id: a.id })} aria-label="Abrir ${esc(a.name)}">${activityMap(a, { w: 640, h: 300, hideZone: !mine })}${a.photos && a.photos[0] ? `<img class="ac-photo" src="${a.photos[0]}" alt="Foto da atividade">` : ''}</button>` : (a.photos && a.photos[0] ? `<img class="ac-photo-big" src="${a.photos[0]}" alt="Foto da atividade">` : '')}
    <div class="ac-foot">
      <button class="kudos-list link sm" ${go('activity', { id: a.id, tab: 'kudos' })}>${k.length ? `<span class="stack">${k.slice(0, 3).map((x) => avatar(x, 22)).join('')}</span> ${k.length} kudos` : '<span class="muted">Ainda sem kudos</span>'}${cs.length ? ` · ${cs.length} ${cs.length > 1 ? 'comentários' : 'comentário'}` : ''}</button>
      <div class="ac-actions">
        ${mine ? '' : `<button class="icon-btn kudo ${hasKudos(a.id) ? 'on' : ''}" ${act('kudos', { id: a.id })} aria-pressed="${hasKudos(a.id)}" aria-label="Dar kudos">${icon('kudos')}</button>`}
        <button class="icon-btn" ${go('activity', { id: a.id, focus: 'comment' })} aria-label="Comentar">${icon('comment')}</button>
        <button class="icon-btn" ${act('share', { id: a.id })} aria-label="Partilhar">${icon('share')}</button>
      </div>
    </div>
  </article>`;
}

function weekStrip(uid) {
  const w0 = startOfWeek(Date.now()), acts = DB.activities.filter((a) => a.uid === uid && a.start >= w0);
  const days = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];
  return `<div class="week-strip">${days.map((d, i) => {
    const day = acts.filter((a) => startOfDay(a.start) === startOfDay(w0 + i * 864e5 + 3 * 36e5));
    const mins = day.reduce((s, a) => s + analyze(a).moving / 60, 0);
    const sz = mins ? clamp(8 + mins / 6, 10, 26) : 6;
    return `<div class="ws-d"><span class="ws-dot ${mins ? 'on' : ''}" style="width:${sz}px;height:${sz}px"></span><span class="ws-l">${d}</span></div>`;
  }).join('')}</div>`;
}

  const goals = DB.goals.slice(0, 2);
  const myCh = DB.challenges.filter((c) => joined(c.id) && c.to > Date.now()).slice(0, 3);
  const suggest = DB.users.filter((u) => u.id !== me() && !isFollowing(me(), u.id)).slice(0, 3);
  return `<div class="feed-grid">
    <aside class="feed-l">
      <section class="card me-card">
        <button class="av-btn center" ${go('profile', { id: me() })}>${avatar(meU, 64)}</button>
        <h2 class="center">${esc(meU.name)}</h2>
        <div class="me-counts"><button ${go('follows', { id: me(), tab: 'following' })}><b>${followingOf(me()).length}</b><span>A seguir</span></button><button ${go('follows', { id: me(), tab: 'followers' })}><b>${followersOf(me()).length}</b><span>Seguidores</span></button><button ${go('profile', { id: me() })}><b>${activitiesOf(me()).length}</b><span>Atividades</span></button></div>
        ${latest ? `<div class="latest"><div class="muted xs up">Última atividade</div><button class="link strong" ${go('activity', { id: latest.id })}>${esc(latest.name)}</button><div class="muted sm">${fmtWhen(latest.start)}</div></div>` : ''}
      </section>
      <section class="card">
        <div class="card-h"><h3>Esta semana</h3><button class="link sm" ${go('training')}>Diário</button></div>
        ${weekStrip(me())}
        <div class="mini-stats"><div><b>${fmtDist(w.dist, 1)}</b> ${distUnit()}</div><div><b>${fmtDur(w.time, true)}</b></div><div><b>${fmtElev(w.gain)}</b> ${elevUnit()}</div></div>
      </section>
      ${goals.length ? `<section class="card"><div class="card-h"><h3>Objetivos</h3><button class="link sm" ${go('training', { tab: 'goals' })}>Gerir</button></div>${goals.map(goalRow).join('')}</section>` : ''}
    </aside>
    <main class="feed-c" aria-label="Atividades de quem segues">
      ${liveBanner()}
      ${REC.state !== 'idle' ? `<button class="card live-banner mine" ${go('record')}><span class="live-dot"></span><span class="grow left"><b>A tua sessão está a gravar</b><span class="muted sm">${REC.act ? esc(REC.act.name) : 'Ainda sem atividade'}</span></span></button>` : ''}
      ${list.length ? shown.map(activityCard).join('') : empty('O teu painel está vazio', 'Segue atletas ou grava a tua primeira atividade para ver aqui o feed.', `<button class="btn btn-primary" ${go('search')}>Encontrar atletas</button>`)}
      ${list.length > shown.length ? `<button class="btn btn-secondary wide" data-act="more">Ver mais atividades</button>` : ''}
    </main>
    <aside class="feed-r">
      <section class="card">
        <div class="card-h"><h3>Os teus desafios</h3><button class="link sm" ${go('groups', { tab: 'challenges' })}>Todos</button></div>
        ${myCh.length ? myCh.map((c) => { const p = challengeProgress(c); return `<button class="ch-mini" ${go('challenge', { id: c.id })}><span class="ch-badge sm">${icon(p.done ? 'medal' : 'trophy', 18)}</span><span class="grow"><b>${esc(c.name)}</b><span class="bar"><i style="width:${(p.pct * 100).toFixed(0)}%"></i></span></span></button>`; }).join('') : `<p class="muted sm">Adere a um desafio para o acompanhares aqui.</p>`}
      </section>
      <section class="card">
        <div class="card-h"><h3>Clubes</h3><button class="link sm" ${go('groups')}>Ver</button></div>
        ${DB.clubs.filter((c) => c.members.includes(me())).map((c) => `<button class="row-btn" ${go('club', { id: c.id })}>${clubBadge(c, 32)}<span>${esc(c.name)}</span></button>`).join('') || '<p class="muted sm">Ainda não estás em nenhum clube.</p>'}
      </section>
      ${suggest.length ? `<section class="card"><div class="card-h"><h3>Sugestões</h3></div>${suggest.map(athleteRow).join('')}</section>` : ''}
    </aside>
  </div>`;
}
function goalRow(g) {
  const p = goalProgress(g), per = { week: 'Semana', month: 'Mês', year: 'Ano' }[g.period];
  const val = g.metric === 'distance' ? `${fmtDist(p.value, 1)} / ${fmtDistU(g.target, 0)}` : g.metric === 'time' ? `${fmtDur(p.value, true)} / ${fmtDur(g.target, true)}` : `${fmtElev(p.value)} / ${fmtElevU(g.target)}`;
  return `<div class="goal-row">${ring(p.pct, 44, 5)}<div><b>${per} · ${g.sport === 'all' ? 'Todos' : SPORTS[g.sport].label}</b><div class="muted sm">${val}</div></div></div>`;
}
function athleteRow(u) {
  u = typeof u === 'string' ? user(u) : u;

  return `<div class="ath-row"><button class="av-btn" ${go('profile', { id: u.id })}>${avatar(u, 36)}</button><button class="grow link left" ${go('profile', { id: u.id })}><b>${esc(u.name)}</b><span class="muted sm">${esc(u.city || '')}</span></button>${u.id === me() ? '' : `<button class="btn btn-sm ${f ? 'btn-secondary' : 'btn-primary'}" ${act('follow', { id: u.id })}>${f ? 'A seguir' : 'Seguir'}</button>`}</div>`;
}
function clubBadge(c, size = 40) {
